version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-journal-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./server:/app/server
      - /app/node_modules
    restart: unless-stopped
    networks:
      - tech-journal-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: tech-journal-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    restart: unless-stopped
    networks:
      - tech-journal-network

networks:
  tech-journal-network:
    driver: bridge
